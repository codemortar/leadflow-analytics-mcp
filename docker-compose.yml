# Local stack: Postgres, a one-off seed job, and the MCP server over HTTP on :8000.
#   READONLY_PASSWORD=... ANTHROPIC_API_KEY=... docker compose up
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: leadflow_mcp
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadflow_mcp"]
      interval: 2s
      retries: 15

  seed:
    image: python:3.12-slim
    depends_on:
      db:
        condition: service_healthy
    volumes: [".:/app"]
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/leadflow_mcp
      PGPASSWORD: postgres
      READONLY_PASSWORD: ${READONLY_PASSWORD:?set READONLY_PASSWORD}
    command: >
      sh -c "apt-get update -qq && apt-get install -qq -y postgresql-client >/dev/null &&
             pip install -q 'psycopg[binary]' &&
             python scripts/seed.py &&
             psql -h db -U postgres -d leadflow_mcp -v readonly_password=\"'$$READONLY_PASSWORD'\" -f db/readonly_role.sql"

  server:
    build: .
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      READONLY_DATABASE_URL: postgresql://leadflow_readonly:${READONLY_PASSWORD}@db/leadflow_mcp
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
